<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>girl.glb 目線追従テスト</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 12px/1.5 sans-serif; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; left: 8px; top: 8px; right: 8px; pointer-events: none; text-shadow: 0 0 3px #000; white-space: pre-wrap; }
  #crouchBtn { position: fixed; left: 50%; transform: translateX(-50%); bottom: 64px; padding: 12px 28px; font-size: 16px; border: 0; border-radius: 24px; background: #4a7cff; color: #fff; }
  #maskBtn { position: fixed; left: 50%; transform: translateX(-50%); bottom: 116px; padding: 12px 28px; font-size: 16px; border: 0; border-radius: 24px; background: #2f9e75; color: #fff; }
  #maskBtn:disabled { background: #666; }
  #crouchBtn:active { background: #3a63cc; }
  #spec { position: fixed; left: 8px; right: 8px; bottom: 8px; background: rgba(0,0,0,.7); border-radius: 8px; padding: 6px 10px; max-height: 45%; overflow: auto; }
  #spec summary { cursor: pointer; font-weight: bold; }
  #spec pre { white-space: pre-wrap; margin: 6px 0 0; font-size: 11px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">読み込み中…</div>
<button id="maskBtn" hidden>マスクを上げる</button>
<button id="crouchBtn" hidden>しゃがむ</button>
<details id="spec"><summary>設定 / Swift移植メモ</summary><pre id="specText"></pre></details>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/* =====================================================================
 * 設定（SETTINGS）— ここだけを後でSwiftに移植する
 * ---------------------------------------------------------------------
 * 【Swift移植メモ】
 *  - この SETTINGS が「挙動の仕様書」。Swift側では同じ名前・同じ値の
 *    struct (例: GazeSettings) にそのまま写す。
 *  - 「カメラ」= Webでは操作中のカメラ、Swiftでは ARFrame.camera.transform
 *    （= プレイヤーのiPhone）。
 *  - 動きの順序（これが仕様の核）:
 *      ① 目がカメラを即座に見る（eyeSmoothing: 速い）
 *      ② headDelaySec 秒遅れて、頭が「その時点のカメラ位置」へ動き出す
 *      ③ 頭の回転が headOnlyDeg を超えた分は、首が回して分担する
 *      ④ 頭＋首は左右 maxYawDeg・上下 maxPitchDeg まで。それ以上は目だけが追う
 *         （上下左右は「頭の正面・上・右」の3軸に分けて別々に制限する）
 *      ⑥ ボタンで crouch を最後のフレームまで再生して止め、もう一度押すと逆再生で
 *         stand に戻る。時間 t を自分で進める方式（t: 0〜長さ、向き dir: +1/-1/0）。
 *         t>0 の間は crouch の重み1・stand の重み0、t==0 で stand に戻す（0フレーム目は同じ姿勢）。
 *         途中でボタンを押すと、その場から向きだけが反転する。
 *      ⑦ 瞬き: 間隔をランダムに空けて、閉じる→止まる→開くを滑らかな曲線で再生。
 *         乱数で次の時刻を決めるだけの単純な状態機械（Swiftでも同じ式でblendShapeに入れる）。
 *         値は「アニメ側の値 + 瞬き」(上限1)。
 *      ⑧ 呼吸: 胸・肩の骨をごく小さく往復させる（吸う0.4:吐く0.6、周期は毎回ゆらぐ）。
 *         アニメの姿勢の「上に足す」回転なので、standやcrouchと一緒に使える。
 *         各ボーンの回転軸は、初期姿勢のワールドの「右」「正面」からボーンのローカルへ変換して求める。
 *      ⑨ マスクを上げる: アニメに無い動きなので、腕を「2ボーンIK」で動かす。
 *         手首の目標位置を頭の座標（正面・上・横）で決め、肩→ひじ→手首の長さから
 *         ひじの位置を解析的に求め、各ボーンを「今の向き→求めた向き」へ回す。
 *         順序: 手を上げる → 手が着いたらモーフ0→1 → 少し止める → 手を下ろす。
 *         IKは目線補正の「後」に行う（頭が動いた後の位置へ手を持っていくため）。
 *      ⑤ 目が上へ startDeg 以上向いたら、上まぶたのモーフを 0→1 へ段階的に上げる
 *         （上を向く角度 = 目の向きの「上方向成分」。頭の動きを引いた、目だけの動き）
 *         モーフの値は「アニメ側の値 + まぶた補正」(上限1)。Swiftでは blendShape の weight に同じ式を使う
 *  - 骨の操作: RealityKitなら ModelEntity.jointTransforms、
 *    SceneKitなら SCNNode の orientation を、アニメ再生後に上書きする。
 *  - 毎フレームの順序: 補正を戻す → アニメ更新 → 補正前の姿勢を保存
 *    → 目線補正を適用（この順序も移植すること）。
 *  - 補正計算は数学だけなので simd_quatf / SIMD3<Float> にそのまま置換可能。
 *  - girl.glb は MMD系の骨名（頭/首/目.L/目.R）。USDZ変換後に名前が
 *    変わる場合は bones の名前だけ直す。
 * ===================================================================== */
const SETTINGS = {
  model: "girl.glb",
  idle: {
    clipNames: ["stand", "スタンド", "立ち", "idle", "待機", "standing"], // この順で探す（大文字小文字は区別しない）
    file: "",                      // standが別のglbにあるときそのファイル名（例: "stand.glb"）。空ならgirl.glb内を探す
    fallbackToFirstClip: true,     // 見つからなければ最初のクリップ
    loopForever: true,             // 1フレームだけのポーズでも止めずに流し続ける
  },
  actions: {
    crouch: {
      clipName: "crouch",   // しゃがむアニメ（0フレーム目 = standと同じポーズ）
      speed: 1,             // 再生速度（逆再生も同じ速さ）
      labels: { down: "しゃがむ", up: "立つ" },  // ボタンの表示
    },
  },
  maskUp: {
    hand: "R",                  // 使う手（"R" か "L"）
    morph: "鼻マスク化",        // 手が顔に着いてから 0→1 にするモーフ
    raiseSec: 0.6,              // 手を顔の前へ上げる時間
    morphSec: 0.35,             // モーフを動かす時間
    holdSec: 0.3,               // 動かした後に手を止める時間
    lowerSec: 0.6,              // 手を下ろす時間
    target:  { forward: 0.14, up: -0.01, side: 0.03 }, // 手首の位置（頭の座標。m。sideは手の側へ）
    fingerAim: { forward: 0.07, up: 0.04 },            // 指先が向く点（鼻のあたり）
    elbowHint: { down: 1.0, out: 0.6, back: 0.3 },     // ひじが向く方向（下・外・後ろ）
    labels: { up: "マスクを上げる", down: "マスクを下ろす" },
    arms: {                     // 骨名の候補（three.jsは「.」を消すので両方）
      R: { shoulder: ["腕.R", "腕R"], elbow: ["ひじ.R", "ひじR"], wrist: ["手首.R", "手首R"],
           finger: ["中指１.R", "中指１R", "人指１.R", "人指１R"] },
      L: { shoulder: ["腕.L", "腕L"], elbow: ["ひじ.L", "ひじL"], wrist: ["手首.L", "手首L"],
           finger: ["中指１.L", "中指１L", "人指１.L", "人指１L"] },
    },
  },
  blink: {
    morph: "まばたき",       // シェイプキー（モーフ）名
    intervalSec: [2.5, 6],   // 次の瞬きまでの間隔（この範囲でランダム）
    closeSec: 0.07,          // 閉じる時間
    holdSec: 0.03,           // 閉じたまま止まる時間
    openSec: 0.12,           // 開く時間（閉じるより少しゆっくり）
    doubleChance: 0.15,      // 続けて2回まばたきする確率
    doubleGapSec: 0.18,      // 2回目までの間隔
  },
  breath: {
    amount: 1.0,            // 全体の強さ（0で止める、2で2倍）
    periodSec: 4.0,         // 1回の呼吸の長さ
    variation: 0.15,        // 周期のゆらぎ（±15%）。毎回少しずつ変わる
    inhaleRatio: 0.4,       // 1周期のうち「吸う」時間の割合（吐くほうが長い）
    bones: [                // 吸うと胸が起き、肩が上がる。角度は振幅(度)
      { names: ["上半身"],  pitchDeg: 0.5 },     // pitch: 胸の前後（右方向の軸まわり）
      { names: ["上半身2"], pitchDeg: 1.0 },
      { names: ["肩.L", "肩L"], rollDeg: 0.6 },  // roll: 肩の上下（正面方向の軸まわり）
      { names: ["肩.R", "肩R"], rollDeg: -0.6 }, // 左右で符号が逆
    ],
  },
  gaze: {
    maxYawDeg: 15,         // 頭＋首の左右の上限
    maxPitchDeg: 30,       // 頭＋首の上下の上限（左右より広い）
    headOnlyDeg: 10,       // 頭だけで回す範囲。超えた分を首が回す
    headDelaySec: 0.25,    // 目が見てから、頭が動き出すまでの遅れ
    headSmoothing: 6,      // 頭の追従の速さ（大きいほど速い）
    eyeMaxDeg: 25,         // 目が正面から向ける最大角度
    eyeSmoothing: 30,      // 目の追従の速さ
    forwardWorldAtRest: [0, 0, 1], // 初期姿勢でモデルが正面を向く方向（ワールド）
    eyelid: {              // 目が上を向くと、上まぶたも連動して上がる
      morph: "まぶたを上げる", // シェイプキー（モーフ）名
      startDeg: 14,          // 目が正面からこの角度以上上を向いたら動き出す
      fullDeg: 25,           // この角度で最大（1.0）。eyeMaxDegと同じにしておく
      smoothing: 15,         // 動きの滑らかさ（大きいほど速い）
    },
    bones: {               // 名前の候補（three.jsは「.」を消すので両方書く）
      head: ["頭", "head"],
      neck: ["首", "neck"],
      eyes: [["目.L", "目L"], ["目.R", "目R"]],
    },
  },
};

const hud = document.getElementById("hud");
const specText = document.getElementById("specText");
const G = SETTINGS.gaze;
const DEG = THREE.MathUtils.degToRad(1);

/* ---------- three.js 基本 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222428);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(2, 4, 3);
scene.add(sun);
scene.add(new THREE.GridHelper(4, 8, 0x555555, 0x333333));

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 100);
const controls = new OrbitControls(camera, renderer.domElement);
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ---------- 状態 ---------- */
let mixer = null;
const rig = { head: null, neck: null, eyes: [] };  // 各 {bone, axis, saved, q}
const info = { clip: "なし", clips: [], bones: [] };
const clock = new THREE.Clock();
const history = [];                                // カメラ位置の履歴（頭の遅れ用）
const stat = { total: 0, eyeDeg: 0, eyeUpDeg: 0, clamped: false };
const crouch = { action: null, stand: null, dur: 0, t: 0, dir: 0, down: false };
const btn = document.getElementById("crouchBtn");
btn.addEventListener("click", () => {
  const A = SETTINGS.actions.crouch;
  crouch.down = !crouch.down;            // 押すたびに「しゃがむ」⇔「立つ」
  crouch.dir = crouch.down ? 1 : -1;     // 途中で押しても、その場から向きだけ反転
  btn.textContent = crouch.down ? A.labels.up : A.labels.down;
});
const armEntries = [];    // マスクの腕 [肩, ひじ, 手首]
let fingerBone = null;    // 手の向きの基準（中指の付け根）
const maskMorphs = [];    // マスクのモーフ
const mask = { phase: "idle", t: 0, on: false, value: 0, from: 0, to: 0 };
const maskBtn = document.getElementById("maskBtn");
maskBtn.addEventListener("click", () => {
  if (mask.phase !== "idle") return;
  mask.on = !mask.on;                    // 押すたびに「上げる」⇔「下ろす」
  mask.from = mask.value;
  mask.to = mask.on ? 1 : 0;
  mask.phase = "raise"; mask.t = 0;
  maskBtn.disabled = true;
  const L = SETTINGS.maskUp.labels;
  maskBtn.textContent = mask.on ? L.down : L.up;
});
const breathBones = [];   // 呼吸で動かす骨 [{e, axis, deg}]
const breath = { phase: 0, period: 4 };
const blinkMorphs = [];   // 瞬きのモーフ
const blink = { next: 2.0, t: -1 };   // next: 次の瞬き開始時刻 / t: 瞬き中の経過秒（-1=待機中）
const morphs = [];        // まぶたのモーフ [{mesh, i, saved}]
let lidValue = 0;         // 現在のまぶた補正 0〜1

/* ---------- ボーン探索 ---------- */
function findBone(root, names, keyword) {
  let exact = null, partial = null;
  root.traverse(o => {
    const n = o.name, u = o.userData && o.userData.name;
    if (names.includes(n) || (u && names.includes(u))) exact = exact || o;
    else if (keyword && n.toLowerCase().includes(keyword)) {
      if (!partial || n.length < partial.name.length) partial = o;
    }
  });
  return exact || partial;
}
function makeEntry(bone) {
  // 初期姿勢で「正面」がボーンのローカルのどの軸かを求める
  const restQ = bone.getWorldQuaternion(new THREE.Quaternion());
  const axis = new THREE.Vector3(...G.forwardWorldAtRest).normalize().applyQuaternion(restQ.invert());
  const up = new THREE.Vector3(0, 1, 0).applyQuaternion(restQ);   // restQは反転済みなので「ローカルの上」
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(restQ); // 同じく「ローカルの右」
  return { bone, axis, up, right, saved: bone.quaternion.clone(), q: new THREE.Quaternion() };
}
const allEntries = () => [rig.neck, rig.head, ...rig.eyes].filter(Boolean);

/* ---------- 読み込み ---------- */
new GLTFLoader().load(SETTINGS.model, gltf => {
  const model = gltf.scene;
  scene.add(model);
  model.updateMatrixWorld(true);

  model.traverse(o => { if (o.isBone) info.bones.push(o.name); });
  info.clips = gltf.animations.map(a => a.name);

  // 待機アニメーション（stand）
  function startIdle(clips) {
    info.clips = clips.map(a => a.name);
    if (!clips.length) { specText.textContent = buildSpecText(); return; }
    let clip = null;
    for (const n of SETTINGS.idle.clipNames) {
      clip = clips.find(a => a.name.toLowerCase() === n.toLowerCase());
      if (clip) break;
    }
    if (!clip && SETTINGS.idle.fallbackToFirstClip) clip = clips[0];
    if (!clip) { specText.textContent = buildSpecText(); return; }
    // 1フレームだけのクリップは長さが0になり、ループが壊れるので長さを与える
    if (clip.duration <= 0) clip.duration = 1;
    mixer = new THREE.AnimationMixer(model);
    const action = mixer.clipAction(clip);
    action.setLoop(SETTINGS.idle.loopForever ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
    action.clampWhenFinished = true;
    action.play();
    info.clip = clip.name;

    // しゃがみ（時間tを自分で進めるため、一時停止状態で姿勢だけ評価させる）
    const A = SETTINGS.actions.crouch;
    const cc = clips.find(a => a.name.toLowerCase() === A.clipName.toLowerCase());
    if (cc) {
      if (cc.duration <= 0) cc.duration = 1;
      crouch.stand = action;
      crouch.action = mixer.clipAction(cc);
      crouch.dur = cc.duration;
      crouch.action.play();
      crouch.action.paused = true;
      crouch.action.setEffectiveWeight(0);
      btn.hidden = false;
      btn.textContent = A.labels.down;
    }
    specText.textContent = buildSpecText();
  }
  if (SETTINGS.idle.file) {
    new GLTFLoader().load(SETTINGS.idle.file, g => startIdle(g.animations),
      undefined, () => { hud.dataset.idleError = "1"; });
  } else {
    startIdle(gltf.animations);
  }

  const h = findBone(model, G.bones.head, "head");
  const n = findBone(model, G.bones.neck, "neck");
  if (h) rig.head = makeEntry(h);
  if (n) rig.neck = makeEntry(n);
  G.bones.eyes.forEach(names => {
    const e = findBone(model, names, null);
    if (e) rig.eyes.push(makeEntry(e));
  });

  // マスクの腕
  {
    const M = SETTINGS.maskUp, names = M.arms[M.hand];
    const sh = findBone(model, names.shoulder, null), el = findBone(model, names.elbow, null);
    const wr = findBone(model, names.wrist, null);
    fingerBone = findBone(model, names.finger, null);
    if (sh && el && wr && fingerBone) {
      armEntries.push(makeEntry(sh), makeEntry(el), makeEntry(wr));
      maskBtn.hidden = false;
      maskBtn.textContent = M.labels.up;
    }
  }

  // 呼吸で動かす骨
  SETTINGS.breath.bones.forEach(c => {
    const b = findBone(model, c.names, null);
    if (!b) return;
    const e = makeEntry(b);
    breathBones.push({ e, axis: c.pitchDeg !== undefined ? e.right : e.axis, deg: c.pitchDeg ?? c.rollDeg });
  });
  breath.period = SETTINGS.breath.periodSec;

  // まぶたのモーフ（メッシュが複数に分かれていても全部に適用）
  const collectMorph = (name, list) => model.traverse(o => {
    const dict = o.isMesh && o.morphTargetDictionary;
    if (dict && name in dict) {
      const i = dict[name];
      list.push({ mesh: o, i, saved: o.morphTargetInfluences[i] || 0 });
    }
  });
  collectMorph(G.eyelid.morph, morphs);
  collectMorph(SETTINGS.blink.morph, blinkMorphs);
  collectMorph(SETTINGS.maskUp.morph, maskMorphs);

  // カメラを頭の正面に置く
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const target = h ? h.getWorldPosition(new THREE.Vector3()) : box.getCenter(new THREE.Vector3());
  controls.target.copy(target);
  camera.position.set(target.x, target.y, target.z + Math.min(Math.max(size.y, 1), 2) * 0.8);
  controls.update();

  specText.textContent = buildSpecText();
}, undefined, err => {
  hud.textContent = "girl.glb を読み込めません。index_gaze.html と同じフォルダに置き、" +
    "file:// ではなくGitHub Pagesやローカルサーバーで開いてください。\n" + err;
});

/* ---------- 目線補正（純粋な数学。Swiftへそのまま移植する部分） ---------- */
const _f = new THREE.Vector3(), _t = new THREE.Vector3(), _p = new THREE.Vector3(), _dp = new THREE.Vector3();
const _id = new THREE.Quaternion(), _q = new THREE.Quaternion(), _lim = new THREE.Quaternion();

// ボーンのワールド回転を desired にする（親のワールド回転を考慮してローカルへ変換）
function setWorldQuat(bone, desired) {
  bone.parent.updateWorldMatrix(true, false);
  const pq = bone.parent.getWorldQuaternion(new THREE.Quaternion());
  bone.quaternion.copy(pq.invert().multiply(desired));
  bone.updateMatrixWorld(true);
}
// 「f→t」の回転を maxRad までに制限して out に入れる。戻り値は元の角度
function limitedRotation(f, t, maxRad, out) {
  const angle = f.angleTo(t);
  _q.setFromUnitVectors(f, t);
  out.copy(_id).slerp(_q, angle > maxRad ? maxRad / angle : 1);
  return angle;
}
// 過去のカメラ位置（time秒前）
function delayedCameraPos(now, delay, out) {
  const want = now - delay;
  let pick = history[0];
  for (const s of history) { if (s.t <= want) pick = s; else break; }
  return out.copy(pick.pos);
}
const headQ = new THREE.Quaternion();

// ---- マスクを上げる ----
const smooth01 = x => { x = THREE.MathUtils.clamp(x, 0, 1); return x * x * (3 - 2 * x); };
// 手の上げ具合 w(0〜1) を返しつつ、モーフの値 mask.value も進める
function updateMask(dt) {
  const M = SETTINGS.maskUp;
  if (mask.phase === "idle") return 0;
  mask.t += dt;
  let w = 0;
  if (mask.phase === "raise") {
    w = mask.t / M.raiseSec;
    if (mask.t >= M.raiseSec) { mask.phase = "morph"; mask.t = 0; w = 1; }
  } else if (mask.phase === "morph") {
    w = 1;
    mask.value = mask.from + (mask.to - mask.from) * smooth01(mask.t / M.morphSec);
    if (mask.t >= M.morphSec) { mask.value = mask.to; mask.phase = "hold"; mask.t = 0; }
  } else if (mask.phase === "hold") {
    w = 1;
    if (mask.t >= M.holdSec) { mask.phase = "lower"; mask.t = 0; }
  } else if (mask.phase === "lower") {
    w = 1 - mask.t / M.lowerSec;
    if (mask.t >= M.lowerSec) { mask.phase = "idle"; mask.t = 0; w = 0; maskBtn.disabled = false; }
  }
  return THREE.MathUtils.clamp(w, 0, 1);
}
// ボーンの向きを「from方向→to方向」へ回す（ねじりは変えない）。ratio<1なら途中まで
function swingBone(bone, from, to, ratio = 1) {
  const full = new THREE.Quaternion().setFromUnitVectors(from.clone().normalize(), to.clone().normalize());
  const q = new THREE.Quaternion().slerp(full, ratio);
  setWorldQuat(bone, q.multiply(bone.getWorldQuaternion(new THREE.Quaternion())));
}
// 2ボーンIK: 手首を顔の前へ。wは上げ具合（0=今の姿勢、1=顔の前）
function applyMaskArm(w) {
  if (w <= 0 || armEntries.length < 3 || !rig.head) return;
  const M = SETTINGS.maskUp, [sh, el, wr] = armEntries.map(e => e.bone);
  const P = b => b.getWorldPosition(new THREE.Vector3());
  const S = P(sh), E = P(el), W = P(wr);
  const L1 = S.distanceTo(E), L2 = E.distanceTo(W);

  // 頭の「正面・上・横」
  const hq = rig.head.bone.getWorldQuaternion(new THREE.Quaternion());
  const f = rig.head.axis.clone().applyQuaternion(hq).normalize();
  const u = rig.head.up.clone().applyQuaternion(hq).normalize();
  const left = new THREE.Vector3().crossVectors(u, f).normalize();     // モデルの左（+X）
  const side = M.hand === "R" ? left.clone().negate() : left;          // 手の側
  const hp = P(rig.head.bone);
  const T = hp.clone().addScaledVector(f, M.target.forward).addScaledVector(u, M.target.up).addScaledVector(side, M.target.side);
  const nose = hp.clone().addScaledVector(f, M.fingerAim.forward).addScaledVector(u, M.fingerAim.up);

  const e = smooth01(w);
  const Tw = W.clone().lerp(T, e);                                     // 今の手首 → 顔の前
  // ひじの向き: 今のひじの向き → 下・外・後ろ
  const hint = new THREE.Vector3(0, -M.elbowHint.down, 0)
    .addScaledVector(side, M.elbowHint.out).addScaledVector(f, -M.elbowHint.back).normalize();
  const pole = E.clone().sub(S).normalize().lerp(hint, e).normalize();

  // 解析的な2ボーンIK
  const toT = Tw.clone().sub(S);
  const dir = toT.clone().normalize();
  const d = THREE.MathUtils.clamp(toT.length(), Math.abs(L1 - L2) + 1e-4, L1 + L2 - 1e-4);
  const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
  const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  let perp = pole.clone().addScaledVector(dir, -pole.dot(dir));
  if (perp.lengthSq() < 1e-6) perp = new THREE.Vector3(0, -1, 0).addScaledVector(dir, dir.y);
  perp.normalize();
  const Enew = S.clone().addScaledVector(dir, a).addScaledVector(perp, h);
  const Wnew = S.clone().addScaledVector(dir, d);

  swingBone(sh, E.clone().sub(S), Enew.clone().sub(S));                // 肩（腕）
  const E2 = P(el), W2 = P(wr);
  swingBone(el, W2.clone().sub(E2), Wnew.clone().sub(E2));             // ひじ
  const W3 = P(wr), F3 = P(fingerBone);                                // 手首：指先を鼻の方へ
  swingBone(wr, F3.clone().sub(W3), nose.clone().sub(Wnew), e);
}

// 呼吸の値(-1〜1)。吸う→吐くを滑らかな曲線でつなぐ。周期は毎回ゆらぐ
function breathValue(dt) {
  const B = SETTINGS.breath;
  breath.phase += dt / breath.period;
  if (breath.phase >= 1) {
    breath.phase -= 1;
    breath.period = B.periodSec * (1 + (Math.random() * 2 - 1) * B.variation);
  }
  const p = breath.phase, r = B.inhaleRatio;
  const v = p < r ? 0.5 - 0.5 * Math.cos(Math.PI * p / r)
                  : 0.5 + 0.5 * Math.cos(Math.PI * (p - r) / (1 - r));
  return (v - 0.5) * 2;
}
const _bq = new THREE.Quaternion();
function applyBreath(dt) {
  const k = breathValue(dt) * SETTINGS.breath.amount;
  breathBones.forEach(b => {
    _bq.setFromAxisAngle(b.axis, b.deg * DEG * k);
    b.e.bone.quaternion.copy(b.e.saved).multiply(_bq);   // アニメの姿勢の上に足す
  });
}

// 瞬きの値(0〜1)を返す。間隔はランダム、たまに2回続けて瞬く
function updateBlink(dt, now) {
  const B = SETTINGS.blink;
  if (blink.t < 0) {
    if (now >= blink.next) blink.t = 0;
    return 0;
  }
  blink.t += dt;
  const hold = B.closeSec + B.holdSec;
  let v;
  if (blink.t < B.closeSec) v = blink.t / B.closeSec;
  else if (blink.t < hold) v = 1;
  else v = 1 - (blink.t - hold) / B.openSec;
  if (blink.t >= hold + B.openSec) {           // 1回終了 → 次の時刻を決める
    blink.t = -1;
    v = 0;
    blink.next = now + (Math.random() < B.doubleChance
      ? B.doubleGapSec
      : B.intervalSec[0] + Math.random() * (B.intervalSec[1] - B.intervalSec[0]));
  }
  v = THREE.MathUtils.clamp(v, 0, 1);
  return v * v * (3 - 2 * v);                  // なめらかな曲線
}

function applyGaze(dt, now) {
  const { head, neck, eyes } = rig;
  if (!head) return;

  // --- 頭＋首：遅れたカメラ位置へ ---
  const headOrig = head.bone.getWorldQuaternion(new THREE.Quaternion());
  const neckOrig = neck ? neck.bone.getWorldQuaternion(new THREE.Quaternion()) : null;
  head.bone.getWorldPosition(_p);
  _f.copy(head.axis).applyQuaternion(headOrig).normalize();
  _t.copy(delayedCameraPos(now, G.headDelaySec, _dp)).sub(_p).normalize();
  // 正面(_f)・上(_u)・右(_r)の3軸に分け、左右と上下を別々に制限する
  const _u = head.up.clone().applyQuaternion(headOrig).normalize();
  const _r = new THREE.Vector3().crossVectors(_u, _f).normalize();
  const tf = _t.dot(_f), tu = _t.dot(_u), tr = _t.dot(_r);
  const yaw = Math.atan2(tr, tf);
  const pitch = Math.atan2(tu, Math.hypot(tf, tr));
  const yawC = THREE.MathUtils.clamp(yaw, -G.maxYawDeg * DEG, G.maxYawDeg * DEG);
  const pitchC = THREE.MathUtils.clamp(pitch, -G.maxPitchDeg * DEG, G.maxPitchDeg * DEG);
  stat.clamped = yawC !== yaw || pitchC !== pitch;
  const cp = Math.cos(pitchC);
  _t.copy(_f).multiplyScalar(cp * Math.cos(yawC))
    .addScaledVector(_r, cp * Math.sin(yawC))
    .addScaledVector(_u, Math.sin(pitchC));
  _q.setFromUnitVectors(_f, _t);
  _lim.copy(_q);
  headQ.slerp(_lim, 1 - Math.exp(-G.headSmoothing * dt));

  // 合計角のうち headOnlyDeg を超えた分を首が担当
  const total = 2 * Math.acos(Math.min(1, Math.abs(headQ.w)));
  stat.total = total;
  const neckRatio = neck && total > G.headOnlyDeg * DEG ? (total - G.headOnlyDeg * DEG) / total : 0;
  if (neck && neckRatio > 0) {
    setWorldQuat(neck.bone, _id.clone().slerp(headQ, neckRatio).multiply(neckOrig));
  }
  setWorldQuat(head.bone, headQ.clone().multiply(headOrig));

  // --- 目：今のカメラ位置を即座に見る ---
  // 頭の今の「正面・上・右」。目の上下の動きをここから測る
  const hq = head.bone.getWorldQuaternion(new THREE.Quaternion());
  const hf = head.axis.clone().applyQuaternion(hq).normalize();
  const hu = head.up.clone().applyQuaternion(hq).normalize();
  const hr = new THREE.Vector3().crossVectors(hu, hf).normalize();
  const pitchOf = v => Math.atan2(v.dot(hu), Math.hypot(v.dot(hf), v.dot(hr)));
  let upSum = 0;
  eyes.forEach(e => {
    const eo = e.bone.getWorldQuaternion(new THREE.Quaternion());
    e.bone.getWorldPosition(_p);
    _f.copy(e.axis).applyQuaternion(eo).normalize();
    const pitchBefore = pitchOf(_f);
    _t.copy(camera.position).sub(_p).normalize();
    limitedRotation(_f, _t, G.eyeMaxDeg * DEG, _lim);
    e.q.slerp(_lim, 1 - Math.exp(-G.eyeSmoothing * dt));
    setWorldQuat(e.bone, e.q.clone().multiply(eo));
    const after = e.axis.clone().applyQuaternion(e.bone.getWorldQuaternion(new THREE.Quaternion())).normalize();
    upSum += pitchOf(after) - pitchBefore;      // 正の値 = 目が上へ動いた量
  });
  stat.eyeDeg = eyes.length ? 2 * Math.acos(Math.min(1, Math.abs(eyes[0].q.w))) / DEG : 0;
  stat.eyeUpDeg = eyes.length ? upSum / eyes.length / DEG : 0;

  // --- 上まぶた：目が startDeg 以上上を向いたら、fullDeg に向けて段階的に ---
  const L = G.eyelid;
  const lidTarget = THREE.MathUtils.clamp((stat.eyeUpDeg - L.startDeg) / (L.fullDeg - L.startDeg), 0, 1);
  lidValue += (lidTarget - lidValue) * (1 - Math.exp(-L.smoothing * dt));
}

/* ---------- メインループ ---------- */
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  const now = clock.elapsedTime;
  controls.update();

  history.push({ t: now, pos: camera.position.clone() });
  while (history.length > 1 && history[0].t < now - 2) history.shift();

  allEntries().forEach(e => e.bone.quaternion.copy(e.saved));   // ① 補正を戻す
  breathBones.forEach(b => b.e.bone.quaternion.copy(b.e.saved));
  armEntries.forEach(e => e.bone.quaternion.copy(e.saved));
  morphs.forEach(m => { m.mesh.morphTargetInfluences[m.i] = m.saved; });
  blinkMorphs.forEach(m => { m.mesh.morphTargetInfluences[m.i] = m.saved; });
  maskMorphs.forEach(m => { m.mesh.morphTargetInfluences[m.i] = m.saved; });
  if (crouch.action) {                                          // ⑥ しゃがみの時間を進める
    const A = SETTINGS.actions.crouch;
    if (crouch.dir !== 0) {
      crouch.t = THREE.MathUtils.clamp(crouch.t + crouch.dir * dt * A.speed, 0, crouch.dur);
      if (crouch.t === crouch.dur || crouch.t === 0) crouch.dir = 0;   // 端で止まる
    }
    const on = crouch.t > 0 ? 1 : 0;      // t==0 は stand と同じ姿勢なので stand に戻す
    crouch.action.time = crouch.t;
    crouch.action.setEffectiveWeight(on);
    crouch.stand.setEffectiveWeight(1 - on);
  }
  if (mixer) mixer.update(dt);                                  // ② アニメ更新
  allEntries().forEach(e => e.saved.copy(e.bone.quaternion));   // ③ 補正前を保存
  breathBones.forEach(b => b.e.saved.copy(b.e.bone.quaternion));
  armEntries.forEach(e => e.saved.copy(e.bone.quaternion));
  applyBreath(dt);                                              // ⑧ 呼吸（目線より先に。頭の位置に反映される）
  morphs.forEach(m => { m.saved = m.mesh.morphTargetInfluences[m.i]; });
  blinkMorphs.forEach(m => { m.saved = m.mesh.morphTargetInfluences[m.i]; });
  maskMorphs.forEach(m => { m.saved = m.mesh.morphTargetInfluences[m.i]; });
  applyGaze(dt, now);                                           // ④ 目線補正＋まぶた計算
  applyMaskArm(updateMask(dt));                                 // ⑨ マスクを上げる腕（目線の後）
  morphs.forEach(m => {                                         // ⑤ まぶたのモーフを適用
    m.mesh.morphTargetInfluences[m.i] = Math.min(1, m.saved + lidValue);
  });
  const blinkValue = updateBlink(dt, now);                      // ⑦ 瞬き
  blinkMorphs.forEach(m => {
    m.mesh.morphTargetInfluences[m.i] = Math.min(1, m.saved + blinkValue);
  });
  maskMorphs.forEach(m => {                                     // マスクのモーフ（手が着いた後に0→1）
    m.mesh.morphTargetInfluences[m.i] = Math.min(1, m.saved + mask.value);
  });
  renderer.render(scene, camera);

  if (rig.head) {
    const tot = stat.total / DEG;
    const headDeg = Math.min(tot, G.headOnlyDeg);
    const neckDeg = Math.max(0, tot - G.headOnlyDeg);
    hud.textContent =
      `待機アニメ: ${info.clip === "なし" ? "なし（standが見つかりません。glbに入れるか SETTINGS.idle.file を指定）" : info.clip}\n` +
      `目: ${stat.eyeDeg.toFixed(1)}° / 頭: ${headDeg.toFixed(1)}° / 首: ${neckDeg.toFixed(1)}°` +
      (stat.clamped ? `（頭＋首が上限で制限中：左右${G.maxYawDeg}°・上下${G.maxPitchDeg}°）` : "") + "\n" +
      (crouch.action ? `しゃがみ: ${(crouch.t / crouch.dur * 100).toFixed(0)}%` +
        (crouch.dir > 0 ? "（しゃがみ中）" : crouch.dir < 0 ? "（立ち上がり中）" : crouch.t > 0 ? "（維持）" : "") + "\n" : "") +
      `目の上向き: ${stat.eyeUpDeg.toFixed(1)}° / 上まぶた: ${(lidValue * 100).toFixed(0)}%` +
      (morphs.length ? "" : `（モーフ「${G.eyelid.morph}」が見つかりません）`) + "\n" +
      `使用ボーン: 首=${rig.neck ? rig.neck.bone.name : "なし"} 頭=${rig.head.bone.name} 目=${rig.eyes.length}個`;
  } else if (info.bones.length) {
    hud.textContent = "頭ボーンが見つかりません。下の骨名一覧を見て SETTINGS.gaze.bones を直してください。";
  }
});

/* ---------- 画面内の仕様メモ ---------- */
function buildSpecText() {
  return "【SETTINGS（これをSwiftに移植）】\n" + JSON.stringify(SETTINGS, null, 2) +
    "\n\n【検出結果】\nクリップ: " + (info.clips.join(", ") || "なし") +
    "\n再生中の待機アニメ: " + info.clip +
    "\nマスクの腕: " + (armEntries.map(e => e.bone.name).join(", ") || "見つからない") +
    "\nマスクのモーフ: " + (maskMorphs.length ? SETTINGS.maskUp.morph : "見つからない") +
    "\n呼吸の骨: " + (breathBones.map(b => b.e.bone.name).join(", ") || "見つからない") +
    "\n瞬きのモーフ: " + (blinkMorphs.length ? SETTINGS.blink.morph + "（" + blinkMorphs.length + "メッシュ）" : "見つからない") +
    "\nまぶたのモーフ: " + (morphs.length ? G.eyelid.morph + "（" + morphs.length + "メッシュ）" : "見つからない") +
    "\n使用ボーン: " + allEntries().map(e => e.bone.name).join(", ") +
    "\n骨名一覧: " + (info.bones.join(", ") || "なし") +
    "\n\n【動きの順序】目が見る → headDelaySec後に頭 → headOnlyDeg超過分は首 → 左右maxYawDeg・上下maxPitchDegまで" +
    "\n【Swift側の対応】カメラ=ARFrame.camera.transform / 骨=jointTransforms or SCNNode";
}
